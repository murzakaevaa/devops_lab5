---
- name: Handlers example
  hosts: webservers
  remote_user: runner
  become: true
  become_method: sudo

  tasks:
    - name: Copy config file
      ansible.builtin.copy:
        content: "server { listen 80; }"
        dest: /tmp/nginx_test.conf
      notify:
        - Restart nginx

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
